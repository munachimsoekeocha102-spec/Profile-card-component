<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <main id="container">
        <section id="img">

        </section>

        <section class="imgg">
            <div class="circle">
                <img src="/images/image-victor.jpg" alt="">
            </div>

            <div class="profile-info">
                <h2>Victor Crest <span>26</span></h2>
                <p class="location">London</p>
            </div>

            <div class="stats">
                <div class="stat">
                    <h3>80K</h3>
                    <p>Followers</p>
                </div>

                <div class="stat">
                    <h3>803K</h3>
                    <p>Likes</p>
                </div>

                <div class="stat">
                    <h3>1.4K</h3>
                    <p>Photos</p>
                </div>

            </div>
        </section>
    </main>

</body>

</html>
